function quickParse(t){t=(t||'').replace(/^\ufeff/,'').trim();if(!t)return[];
if(/^[\[{]/.test(t)){try{let j=JSON.parse(t);j=Array.isArray(j)?j:(j.cards||j.notes||j.items||j.data||[]);const K=(o,ks)=>{for(const k of ks)if(o[k]!=null&&o[k]!=='')return o[k];return''};
return j.map(o=>Array.isArray(o)?{f:unhtml(o[0]),b:unhtml(o[1]),h:unhtml(o[2]),e:unhtml(o[3]),t:'f'}:{f:unhtml(K(o,['f','front','Front','question','Question','term','Term','q'])),b:unhtml(K(o,['b','back','Back','answer','Answer','definition','Definition','a'])),h:unhtml(K(o,['h','hint','Hint','source','Source'])),e:unhtml(K(o,['e','explanation','Explanation','note','Notes'])),t:'f'}).filter(c=>c.f)}catch(e){}}
const lines=t.split(/\r?\n/).filter(l=>l.trim()&&!/^#/.test(l.trim()));if(!lines.length)return[];
let cs;if(lines.filter(l=>l.includes('\t')).length>=lines.length*.6){let rows=lines.map(l=>l.split('\t'));if(/front|back|question|answer|term|definition|mặt/i.test((rows[0][0]||'')+(rows[0][1]||'')))rows.shift();cs=rows.map(r=>({f:r[0],b:r[1],h:r[2],e:r[3],t:'f'}))}else cs=parseCards(lines.join('\n'));

function pwaIcon(n,pad){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,n);g.addColorStop(0,'#4fa3e6');g.addColorStop(1,'#1e5aaa');x.fillStyle=g;x.fillRect(0,0,n,n);const u=n*(1-2*pad)/100,o=n*pad,P=(a,b)=>[o+a*u,o+b*u];x.fillStyle='#fff';x.beginPath();[[40,12],[60,12],[60,38],[86,82],[80,90],[20,90],[14,82],[40,38]].forEach(([a,b],k)=>{const p=P(a,b);k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.closePath();x.fill();x.fillRect(...P(35,8),30*u,8*u);x.fillStyle='#7fd6ff';x.beginPath();[[30,62],[70,62],[82,82],[77,86],[23,86],[18,82]].forEach(([a,b],k)=>{const p=P(a,b);k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.closePath();x.fill();x.fillStyle='#fff';[[42,72,4],[57,76,3],[50,67,2.5]].forEach(([a,b,r])=>{const p=P(a,b);x.beginPath();x.arc(p[0],p[1],r*u,0,7);x.fill()});return c.toDataURL('image/png')}
/* Không có tệp manifest (chỉ tải lên mỗi index.html) → tự tạo manifest và biểu tượng ngay trong trình duyệt */
function pwaFallback(){try{const L=document.querySelector('link[rel=manifest]');if(!L)return;const m={name:'EZChem',short_name:'EZChem',description:'Ôn tập phương trình hóa học vô cơ',lang:'vi',id:location.origin+location.pathname,start_url:location.origin+location.pathname,scope:location.origin+location.pathname.replace(/[^/]*$/,''),display:'standalone',background_color:'#f5f9fd',theme_color:'#1e5aaa',icons:[{src:pwaIcon(192,.12),sizes:'192x192',type:'image/png',purpose:'any'},{src:pwaIcon(512,.12),sizes:'512x512',type:'image/png',purpose:'any'},{src:pwaIcon(512,.2),sizes:'512x512',type:'image/png',purpose:'maskable'}]};L.removeAttribute('crossorigin');L.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));const a=document.querySelector('link[rel=apple-touch-icon]');if(a)a.href=m.icons[0].src.length?pwaIcon(180,.12):a.href;const i=document.querySelector('link[rel=icon]');if(i)i.href=m.icons[0].src}catch(e){}}
try{window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__ip=e;instBtn()});window.addEventListener('appinstalled',()=>{window.__ip=null;instBtn();toast('Đã cài đặt EZChem ✓')})}catch(e){}
try{if(/^https?:$/.test(location.protocol)){fetch('manifest.webmanifest',{credentials:'include'}).then(r=>{if(!r.ok||!/json/.test(r.headers.get('content-type')||''))pwaFallback()}).catch(pwaFallback);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}instBtn()}catch(e){}
